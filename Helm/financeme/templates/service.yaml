apiVersion: v1
kind: Service
metadata:
  name: {{ include "financeme.fullname" . }}-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "financeme.name" . }}
    version: {{ .Values.blueGreen.version }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 8080
    protocol: TCP
